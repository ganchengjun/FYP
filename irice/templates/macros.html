r="2.5"/>{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/>{% endif %}</svg>

{% macro status(value) %}<span class="badge badge-{{ value }}"><span class="status-dot"></span>{{ value|replace('_',' ')|title }}</span>{% endmacro %}
